<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mad Apple">
<meta name="theme-color" content="#14202e">
<title>Mad Apple Winter Workouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a coach's clipboard — sticky week tabs, then attendance → auto groups → the 2-hour card → tracking */
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#14202e; --muted:#5d6b7a; --line:#d9dfe6;
  --apple:#c4122f; --apple-soft:#fbe7ea; --turf:#1f7a4d; --turf-soft:#e3f2ea; --clay:#b8661f; --clay-soft:#f7ece0; --sky:#2a5d9f; --sky-soft:#e5edf8;
  --now:#ffd23f; --grass:#cfe6d4; --grass-dk:#9fcbab; --dirt:#e6c9a6; --chalk:#ffffff;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e141b; --card:#16202b; --ink:#e8edf2; --muted:#93a1b0; --line:#273443;
  --apple:#ff4d63; --apple-soft:#3a1820; --turf:#4cc38a; --turf-soft:#13301f; --clay:#e5974f; --clay-soft:#38260f; --sky:#7fb0ef; --sky-soft:#152844; --now:#e0b52a; --grass:#16342a; --grass-dk:#1f4a39; --dirt:#4a3624; --chalk:#c9d4de; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#14202e}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#14202e;color:#f3f5f7}
header.top .inner{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(19px,5.5vw,24px);white-space:nowrap;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.1}
.brand h1 span{color:#ff4d63}
.sync{font-size:12px;opacity:.75;white-space:nowrap;font-family:var(--mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:inherit;opacity:.7;padding:8px 12px 10px;border-radius:8px 8px 0 0;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
nav.tabs a small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:0;text-transform:none;margin-top:3px;opacity:.85}
nav.tabs a[aria-current="page"]{opacity:1;background:var(--bg);color:var(--ink)}
nav.tabs a:focus-visible{outline:2px solid var(--now);outline-offset:-2px}

.hero{padding-block:20px 6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--apple);font-weight:700}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1;margin:4px 0 8px;text-transform:uppercase;text-wrap:balance}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.cues{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cue{display:inline-flex;gap:8px;align-items:baseline;background:var(--apple-soft);color:var(--ink);padding:6px 10px;border-radius:6px;font-weight:600;font-size:14px}
.cue b{font-family:var(--mono);font-size:11px;color:var(--apple);letter-spacing:.06em;text-transform:uppercase}
.cue.blue{background:var(--sky-soft)} .cue.blue b{color:var(--sky)}

section.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.panel h3{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.count{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.mode{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sky-soft);color:var(--sky);white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:48px}
.chip .num{font-family:var(--display);font-weight:800;font-size:20px;width:30px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.chip .nm{font-weight:600;font-size:14px;line-height:1.2;min-width:0}
.chip .nm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .num{color:var(--apple)}
.chip[aria-pressed="true"] .nm small{color:inherit;opacity:.7}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--apple);outline-offset:2px}

.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grp h4{margin:0 0 6px;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.grp ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px}
.grp .path{font-size:12px;color:var(--muted);margin-top:6px}
.tag{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--apple);margin-left:2px}
.empty{color:var(--muted);font-size:14px;margin:0}

.timeline{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.blk{display:grid;grid-template-columns:72px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.blk.now{border-color:var(--now);box-shadow:0 0 0 2px var(--now)}
.time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;line-height:1.3}
.time small{display:block;color:var(--muted);font-weight:500}
.time .live{display:inline-block;margin-top:6px;background:var(--now);color:#14202e;font-size:10px;padding:1px 6px;border-radius:4px}
.blk h4{margin:0;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.meta{font-size:12px;color:var(--muted);margin:2px 0 6px}
.blk ul{margin:6px 0 0;padding-left:18px}
.blk li{margin:3px 0}
.blk p{margin:6px 0 0}
.blk > div{min-width:0}
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.st{border-radius:10px;padding:12px;border:1px solid var(--line)}
.st.p{background:var(--apple-soft)} .st.h{background:var(--sky-soft)} .st.d{background:var(--turf-soft)}
.st h5{margin:0;font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.st.p h5{color:var(--apple)} .st.h h5{color:var(--sky)} .st.d h5{color:var(--turf)}
.st strong{display:block;font-size:15px;margin:2px 0 2px}
.st ul{font-size:14px}
.scroll{overflow-x:auto}
.rot table{border-collapse:collapse;width:100%;min-width:320px;font-size:13px;margin-top:10px}
.rot th,.rot td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.rot th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rot td.t{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.p{background:var(--apple-soft);color:var(--apple)} .pill.h{background:var(--sky-soft);color:var(--sky)} .pill.d{background:var(--turf-soft);color:var(--turf)}
.flex{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}

input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:110px;resize:vertical}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 14px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Bullpen charter */
.pen-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.pen-top label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.pen-top select{width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.sb{background:var(--bg);border-radius:10px;padding:8px 10px}
.sb b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sb span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sb.good b{color:var(--turf)} .sb.warn b{color:var(--clay)} .sb.bad b{color:var(--apple)}
.countline{font-family:var(--mono);font-weight:700;font-size:14px;margin-bottom:8px}
.pitchpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.pitchpad .wide{grid-column:span 3}@media (max-width:360px){.pitchpad{grid-template-columns:1fr 1fr}.pitchpad .wide{grid-column:span 2}}
.pp{font:inherit;font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;border-radius:12px;border:0;padding:16px;cursor:pointer;min-height:64px}
.pp.k{background:var(--turf);color:#fff} .pp.b{background:var(--apple);color:#fff}
.pp.ip,.pp.f{background:var(--sky-soft);color:var(--sky);font-size:18px}
.pp.nb{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);font-size:18px}
.trail{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;min-height:22px}
.trail span{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--bg)}
.trail span.s{color:var(--turf)} .trail span.bl{color:var(--apple)} .trail span.sep{background:transparent;color:var(--muted)}
.capwarn{margin-top:8px;font-weight:700;color:var(--apple);font-size:14px}

table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th,table.data td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase}
table.data input{width:68px;padding:6px;text-align:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--turf)}
.dot.no{background:transparent;border:1.5px solid var(--line)}
.ptog{font:inherit;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.ptog[aria-pressed="true"]{background:var(--apple);border-color:var(--apple);color:#fff}
.up{color:var(--turf);font-weight:700} .down{color:var(--apple);font-weight:700}
details.panel summary{cursor:pointer;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary h3::after{content:" +";color:var(--muted)}
details.panel[open] summary h3::after{content:" −"}
table.ref{border-collapse:collapse;width:100%;font-size:14px}
table.ref th,table.ref td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.ref th{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tight{margin:0;padding-left:20px} .tight li{margin:4px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 16px}
.lock{border-color:var(--apple)}
.lock form{display:flex;gap:8px;flex-wrap:wrap}
.lock input{flex:1 1 140px;font-size:16px}
.err{color:var(--apple);font-size:13px;font-weight:600;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14202e;color:#f3f5f7;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* Team tab */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.subnav a{text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line)}
.subnav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.prow:last-child{border-bottom:0}
.prow .num{font-family:var(--display);font-weight:800;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.prow .nm{font-weight:700;min-width:0}
.prow .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.prow .pos{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.posb{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.posb.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.posb.none{color:var(--muted)}
.field{width:100%;max-width:560px;display:block;margin:0 auto}
.field .grass{fill:var(--grass)} .field .grass2{fill:var(--grass-dk)} .field .dirt{fill:var(--dirt)} .field .chalk{stroke:var(--chalk);stroke-width:2;fill:none}
.field .base{fill:var(--chalk)} .field .lbl{fill:var(--apple);font-family:var(--mono);font-size:11px;font-weight:700}
.field .pn{fill:var(--ink);font-family:var(--body);font-size:12px;font-weight:700} .field .pn2{fill:var(--muted);font-family:var(--body);font-size:11px;font-weight:500}
.field .tag-bg{fill:var(--card);opacity:.92}
.pens{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);text-decoration:none;color:inherit;display:block}
.pc h4{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;line-height:1.1}
.pc .big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pc .big.good{color:var(--turf)} .pc .big.warn{color:var(--clay)} .pc .big.bad{color:var(--apple)}
.pc .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.pc .kv b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.spark{width:100%;height:46px;display:block;margin-top:8px}
.spark .tgt{stroke:var(--turf);stroke-dasharray:3 3;stroke-width:1}
.spark .ln{stroke:var(--apple);stroke-width:2;fill:none} .spark .pt{fill:var(--apple)}
.spark .ax{fill:var(--muted);font-size:9px;font-family:var(--mono)}
.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.back{display:inline-block;margin-top:16px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.stopwatch{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:12px;margin:10px 0 14px}
.stopwatch select{width:100%}
.sw-time{font-family:var(--display);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.sw-btn{font:inherit;font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;border:0;border-radius:12px;padding:14px 22px;cursor:pointer;background:var(--turf);color:#fff;min-width:120px;min-height:60px}
.sw-btn.run{background:var(--apple)}
@media (max-width:480px){.blk{grid-template-columns:1fr;gap:6px}.time small{display:inline;margin-left:6px}.scoreboard{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.chip,.pp{transition:background .12s,color .12s,transform .08s}.pp:active{transform:scale(.97)}}
</style>
<script src="config.js?v=2"></script>
</head>
<body>
<header class="top"><div class="inner">
  <div class="brand"><h1>Mad Apple <span>Winter</span></h1><span class="sync" id="sync"></span></div>
  <nav class="tabs" id="tabs" aria-label="Weeks"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Plan content (no player names live in this file) ---------- */
const BLOCKS=[
 {s:"17:50",e:"18:00",k:"setup",name:"Arrive + set up",where:"Turf",lead:"Captains",txt:"Turf shoes on, J-bands out, cages and screens set, phones in bags. Coaches take attendance here."},
 {s:"18:00",e:"18:12",k:"warm",name:"Dynamic warm-up",where:"Turf",lead:"Coach Sam",txt:"Jog 2 laps → high knees, butt kicks, A-skips, lunge with twist, lateral shuffles, carioca → 3 × 20-yd build-up sprints. Two lines facing a coach; nobody jogs alone."},
 {s:"18:12",e:"18:20",k:"arm",name:"Arm care (J-bands)",where:"Turf",lead:"Coach Justice",txt:"10 each: forward fly, reverse fly, internal and external rotation at 90°, high pulls, low pulls, throwing-motion pulls. Partners count reps out loud."},
 {s:"18:20",e:"18:35",k:"throw",name:"Throwing progression",where:"Turf, 60 ft",lead:"Both coaches",txt:"Pairs on a line. Wrist flips (10) → one-knee (10) → rocker (10) → full throws back to 60 ft (15). Chest is the target; partner calls 'hit' or 'miss'. Last 2 minutes: quick-hands race, 20 throws, fastest pair wins."},
 {s:"18:35",e:"19:35",k:"stations",name:"Stations",where:"Pen · Cages · Turf",lead:"Justice / captain / Sam"},
 {s:"19:35",e:"19:52",k:"cond",name:"Conditioning",where:"Weight area + turf",lead:"Coach Sam"},
 {s:"19:52",e:"20:00",k:"close",name:"Compete + close",where:"Turf",lead:"Both coaches"}
];
const WEEKS=[
{id:"w1",date:"2026-10-30",label:"Oct 30",theme:"Baseline",focus:"Measure everything so every kid can see himself improve by December. Set the standard: we hustle between stations and nobody stands.",cue:"Every throw has a target.",cap:"20 pitches · 70% · fastballs only",capN:20,tests:true,
 P:{t:"Baseline bullpen",l:["Pre-pen on flat ground: 3 rocker, 3 hip-lead, 5 from the stretch","20 fastballs at 70%. Catcher calls the count out loud after each pitch","Film side and front in slow-mo. Chart every pen below","Non-throwers: catch, chart on the phone, then towel drill ×15 and balance-point holds ×10"]},
 H:{t:"HitTrax baseline",l:["Cage 1 (HitTrax): 10 swings each; captain logs max exit velo and line-drive %","Cage 2 (tee): pause tee ×10, high tee ×5, low tee ×5","Swap cages every 5 minutes"]},
 D:{t:"Ground-ball fundamentals",l:["Short-hop series with a partner, 15 ft: backhand, forehand, middle ×10 each","Funnel + footwork: field, funnel to belly, crow hop, throw to a target","Fungo rounds: 3 balls each, sprint back to the line"]},
 C:{t:"Test day",l:["30-yd sprint, best of 2 (stopwatch)","Broad jump, best of 2 (tape on turf)","Plank hold to failure","Home to 1st: 2 runs each from the box, swing and go. Time it with the stopwatch below","Enter results in Test results below"]},

/* ---------- Network ---------- */
async function load(silent){
  if(!URL_||!pin||pending) return;
  loading=!silent; if(!silent)render();
  try{
    const r=await fetch(URL_+"?pin="+encodeURIComponent(pin)+"&t="+Date.now());
    const j=await r.json();
    if(!j.ok){ if(j.error==="pin"){pinErr="That PIN didn't work. Check with Coach Sam.";pin="";LS.del("ma_pin");D=null} }
    else { if(!pending){D=j;lastSync=new Date();pinErr=""} }
  }catch(e){ if(!silent) toast("Couldn't reach the team sheet. Check your connection.") }
  loading=false; safeRender();
}
let chain=Promise.resolve();
function send(body){
  pending++; updateSync();
  chain=chain.then(async()=>{
    try{
      const r=await fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,pin})});
      const j=await r.json();
      pending--;
      if(!j.ok){toast(j.error==="pin"?"PIN rejected. Sign in again.":"The sheet refused that save.");return false}
      if(!pending){D=j;lastSync=new Date();safeRender()}
      return true;
    }catch(e){pending--;toast("Didn't save. Check your connection and try again.");updateSync();return false}
  });
  return chain;
}
function updateSync(){const s=$("#sync");if(!s)return;
  s.textContent=!URL_?"not connected":!pin?"locked":pending?"saving…":lastSync?"synced "+lastSync.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";}

/* Bullpen charter: log is a list of pitches {r:"S"|"B", t:"FB"|"CH", nb:true when it starts a new batter} */
function penKey(wid,num){return "ma_pen_"+wid+"_"+num}
function getLog(wid,num){try{return JSON.parse(LS.get(penKey(wid,num))||"[]")}catch(e){return []}}
function setLog(wid,num,log){LS.set(penKey(wid,num),JSON.stringify(log))}
function batters(log){const b=[];log.forEach((p,i)=>{if(i===0||p.nb)b.push([]);b[b.length-1].push(p)});return b}
function stats(log){
  const bs=batters(log), pitches=log.length, strikes=log.filter(p=>p.r==="S").length;
  const fps=bs.filter(b=>b[0].r==="S").length;
  const ahead=bs.filter(b=>{const f=b.slice(0,3),k=f.filter(p=>p.r==="S").length;return k>=Math.min(2,f.length)}).length;
  const ch=log.filter(p=>p.t==="CH"), chS=ch.filter(p=>p.r==="S").length;
  const cur=bs.length?bs[bs.length-1]:[];
  return {pitches,strikes,batters:bs.length,fps,ahead,ch:ch.length,chS,balls:cur.filter(p=>p.r==="B").length,ks:Math.min(2,cur.filter(p=>p.r==="S").length),ended:!!(log.length&&log[log.length-1].end)};
}
function pct(a,b){return b?Math.round(a/b*100):null}
function grade(v,good,ok){return v==null?"":v>=good?"good":v>=ok?"warn":"bad"}
function penPanel(w,present){

  const capHit=w.capN&&s.pitches>=w.capN;
  return `<section class="panel" id="pen"><div class="panel-head"><h3>Bullpen charter</h3><span class="count">${w.capN?"Cap "+w.capN:"Flat ground week"}</span></div>
  <p class="hint">A non-pitcher charts on a coach's phone. Tap every pitch. Walks, strikeouts and balls in play start the next batter on their own; tap <b>New batter</b> for anything else. Fouls count as strikes.</p>

  <div class="scoreboard">
   <div class="sb ${grade(sp,60,50)}"><b>${sp==null?"–":sp+"%"}</b><span>Strikes ${s.strikes}/${s.pitches}</span></div>
   <div class="sb ${grade(fp,60,50)}"><b>${fp==null?"–":fp+"%"}</b><span>1st-pitch K</span></div>

  </section>`;

function safeRender(){if(busy())return;render()}

/* ---------- Events ---------- */
document.addEventListener("submit",e=>{if(e.target.id==="pinform"){e.preventDefault();const v=$("#pin").value.trim();if(!v)return;pin=v;pinErr="";LS.set("ma_pin",v);load()}});
document.addEventListener("click",e=>{
  const w=WEEKS.find(x=>x.id===current);
  const c=e.target.closest("[data-att]");
  if(c&&w){const num=Number(c.dataset.att);const on=c.getAttribute("aria-pressed")!=="true";
    // optimistic local change
    const rows=D.attendance.filter(r=>!(r.Week===w.id&&Number(r.Number)===num));rows.push({Week:w.id,Date:w.date,Number:num,Present:on});D.attendance=rows;render();
    send({action:"attendance",week:w.id,date:w.date,num,present:on});return}
  const pt=e.target.closest("[data-ptog]");
  if(pt){const num=Number(pt.dataset.ptog);const on=pt.getAttribute("aria-pressed")!=="true";
    D.roster=D.roster.map(r=>Number(r.Number)===num?{...r,Pitcher:on}:r);render();send({action:"pitcher",num,pitcher:on});return}
  const ty=e.target.closest("[data-type]");
  if(ty){penType=ty.dataset.type;render();return}
  const pp=e.target.closest("[data-pitch]");
  if(pp&&w&&penPitcher){const log=getLog(w.id,penPitcher),k=pp.dataset.pitch;
    const last=log[log.length-1];
    if(k==="NB"){if(last&&!last.end)last.end="m"}
    else{
      const before=last&&!last.end?countStrikes(log):0;
      const p={r:k==="B"?"B":"S",t:penType};if(last&&last.end)p.nb=true;
      if(k==="F")p.f=1;
      log.push(p);
      const balls=stats(log).balls;
      if(k==="IP"||(k==="S"&&before>=2)||(k==="B"&&balls>=4)) p.end="a";
    }
    setLog(w.id,penPitcher,log);render();return}
  if(e.target.id==="penundo"&&w){const log=getLog(w.id,penPitcher),last=log[log.length-1];
    if(last&&last.end==="m")delete last.end;else log.pop();
    setLog(w.id,penPitcher,log);render();return}
  if(e.target.id==="penclear"&&w){if(e.target.dataset.confirm!=="1"){e.target.dataset.confirm="1";e.target.textContent="Tap again to clear";return}setLog(w.id,penPitcher,[]);render();return}
  if(e.target.id==="pensave"&&w){const log=getLog(w.id,penPitcher),s=stats(log);
    e.target.disabled=true;e.target.textContent="Saving…";
    send({action:"bullpen",week:w.id,date:w.date,num:Number(penPitcher),pitches:s.pitches,strikes:s.strikes,batters:s.batters,fps:s.fps,ahead:s.ahead,ch:s.ch,chStrikes:s.chS,cue:($("#pencue")||{}).value||""}).then(ok=>{if(ok)toast("Pen saved to the team sheet");else render()});return}
  const ts=e.target.closest("[data-savetest]");
  if(ts&&w){const num=ts.dataset.savetest,g=k=>{const el=document.getElementById(`t-${w.id}-${num}-${k}`);const v=el?el.value.trim():"";return v===""?"":Number(v)};
    const body={action:"test",week:w.id,date:w.date,num:Number(num),ev:g("ev"),ld:g("ld"),sprint:g("sprint"),broad:g("broad"),plank:g("plank"),h1:g("h1")};
    if([body.ev,body.ld,body.sprint,body.broad,body.plank,body.h1].some(v=>v!==""&&isNaN(v))){toast("Numbers only in test boxes");return}
    ts.textContent="Saving…";ts.disabled=true;send(body).then(ok=>{if(ok){if(drafts[w.id])delete drafts[w.id][num];toast("Saved #"+num+"'s numbers")}else render()});return}
});
document.addEventListener("click",e=>{
  if(e.target.id==="swbtn"){const w=WEEKS.find(x=>x.id===current);if(!w)return;
    if(!sw.running){sw.running=true;sw.start=performance.now();sw.elapsed=0;e.target.textContent="Stop";e.target.classList.add("run");tickSW()}
    else{sw.running=false;sw.elapsed=performance.now()-sw.start;const t=(sw.elapsed/1000).toFixed(2);
      setDraft(w.id,sw.who,"h1",t);const inp=document.getElementById(`t-${w.id}-${sw.who}-h1`);if(inp)inp.value=t;
      e.target.textContent="Start";e.target.classList.remove("run");tickSW();toast("#"+sw.who+": "+t+" sec. Tap Save on his row.")}
    return}
  if(e.target.id==="psave"){const num=Number(e.target.dataset.num),g=id=>(document.getElementById(id)||{}).value||"";
    const R=roster(),me=R.find(p=>p.n===num)||{};
    const body={action:"player",num,pos1:g("ed-pos1"),pos2:g("ed-pos2"),bats:g("ed-bats"),throws:g("ed-throws"),pitcher:me.p&&me.pos1!=="P"&&me.pos2!=="P"?true:false};
    D.roster=D.roster.map(r=>Number(r.Number)===num?{...r,Primary:body.pos1,Secondary:body.pos2,Bats:body.bats,Throws:body.throws}:r);
    e.target.textContent="Saving…";e.target.disabled=true;
    send(body).then(ok=>{if(ok)delete pdraft[num];toast(ok?"Saved":"Didn't save");render()});return}
});
document.addEventListener("change",e=>{const m=/^ed-(pos1|pos2|bats|throws)$/.exec(e.target.id||"");if(m){const n=Number(current.slice(7));pdraft[n]=pdraft[n]||{};pdraft[n][m[1]]=e.target.value}});
document.addEventListener("change",e=>{if(e.target.id==="swwho"){sw.who=e.target.value;sw.elapsed=0;e.target.blur();const t=document.getElementById("sw-time");if(t)t.textContent="0.00"}});
document.addEventListener("input",e=>{const d=e.target.dataset&&e.target.dataset.draft;if(d){const[wid,num,k]=d.split("|");setDraft(wid,num,k,e.target.value)}});
// strikes so far in the current at-bat
function countStrikes(log){let k=0;for(let i=log.length-1;i>=0;i--){k+=log[i].r==="S"?1:0;if(i===0||log[i].nb)break}return k}
document.addEventListener("change",e=>{if(e.target.id==="penwho"){penPitcher=e.target.value;LS.set("ma_pen_pitcher",penPitcher);e.target.blur();render()}});
let nTimer=null;
function saveNote(wid,txt){const w=WEEKS.find(x=>x.id===wid);const s=$("#nsave");if(s)s.textContent="Saving…";
  send({action:"note",week:wid,date:w.date,text:txt}).then(ok=>{const s=$("#nsave");if(s)s.textContent=ok?"Saved":"Not saved"})}
document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("notes-")){const wid=e.target.id.slice(6),v=e.target.value;const s=$("#nsave");if(s)s.textContent="Typing…";clearTimeout(nTimer);nTimer=setTimeout(()=>saveNote(wid,v),1500)}});
document.addEventListener("focusout",e=>{if(e.target.id&&e.target.id.startsWith("notes-")){clearTimeout(nTimer);const wid=e.target.id.slice(6);if(e.target.value!==note(wid))saveNote(wid,e.target.value)}});

window.addEventListener("hashchange",route);
route();
load();
// keep both coaches in sync
setInterval(()=>{if(document.visibilityState==="visible")load(true)},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load(true)});
setInterval(()=>{const w=WEEKS.find(x=>x.id===current);if(w&&w.date===todayStr())safeRender()},30000);
</script>
</body>
</html>
