<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mad Apple">
<meta name="theme-color" content="#14202e">
<title>Mad Apple Winter Workouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: navy header with live band → content column (max 880) → bottom tab bar on phones, inline tabs on desktop */
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#14202e; --muted:#5f6c7b; --line:#dfe4ea; --chip:#e5e9ef;
  --navy:#14202e; --apple:#d21f3c; --apple-soft:#fde8eb; --turf:#16804f; --turf-soft:#e2f3ea;
  --clay:#b8661f; --clay-soft:#f8ecdf; --sky:#2a5d9f; --sky-soft:#e6eef9; --gold:#f2c94c; --now:#ffd23f;
  --grass:#cfe6d4; --grass-dk:#9fcbab; --dirt:#e6c9a6; --chalk:#ffffff;
  --shadow:0 1px 2px rgba(20,32,46,.05),0 6px 18px rgba(20,32,46,.06);
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d131a; --card:#151e28; --ink:#e8edf2; --muted:#93a1b0; --line:#243140; --chip:#1d2834;
  --apple:#ff4d63; --apple-soft:#3a1820; --turf:#4cc38a; --turf-soft:#12301f; --clay:#e5974f; --clay-soft:#36250f;
  --sky:#7fb0ef; --sky-soft:#152844; --now:#e0b52a; --grass:#16342a; --grass-dk:#1f4a39; --dirt:#4a3624; --chalk:#c9d4de;
  --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--apple);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--navy)}

/* Header + nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#f3f5f7}
.hdr{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap;margin:0;flex:1}
.brand span{color:#ff4d63}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#b9c4cf;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#4cc38a}
.sync.wait i{background:#ffd23f} .sync.off i{background:#ff4d63} .sync.idle i{background:#5f6c7b}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy);border-top:1px solid #243140;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#93a1b0;font-weight:700;font-size:11px;letter-spacing:.02em;border-radius:12px;min-height:50px}
nav.tabs svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:#fff}
nav.tabs a[aria-current="page"] svg{stroke:#ff4d63}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:760px){
  body{padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs{position:static;display:flex;gap:2px;background:none;border:0;padding:0}
  nav.tabs a{flex-direction:row;gap:6px;font-size:14px;padding:8px 12px;min-height:0}
  nav.tabs svg{width:18px;height:18px}
  nav.tabs a[aria-current="page"]{background:rgba(255,255,255,.1)}
}
/* Live band */
.live{background:var(--now);color:#14202e}
.live .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.live.soon{background:#d21f3c;color:#fff}
.lv-dot{width:9px;height:9px;border-radius:50%;background:#d21f3c;flex:0 0 auto}
.live.soon .lv-dot{background:#fff}
.lv-t{flex:1;min-width:0;font-size:13px;line-height:1.3} .lv-t small{display:block;opacity:.8;font-size:12px}
.lv-c{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

/* Page */
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.hero{padding-top:18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--apple);font-weight:700}
.title{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,46px);line-height:.98;margin:4px 0 8px;text-transform:uppercase;text-wrap:balance}
.lede{margin:0;max-width:62ch;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:8px;font-weight:600;font-size:14px;background:var(--chip)}
.pill b{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
.pill.red{background:var(--apple-soft)} .pill.red b{color:var(--apple)}
.pill.blue{background:var(--sky-soft)} .pill.blue b{color:var(--sky)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ch h2,.h2{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
.muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted);margin:0}
.mono{font-family:var(--mono)}
.empty{color:var(--muted);font-size:14px;margin:0;padding:6px 0}
.btn{border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;padding:10px 16px;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--apple);font-weight:600;text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}
select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
textarea{width:100%;min-height:130px;resize:vertical}

/* Week strip + segments */
.wkpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.wkpick a{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;text-decoration:none;background:var(--card);border:1px solid var(--line)}
.wkpick b{font-family:var(--display);font-size:16px;text-transform:uppercase;line-height:1.05}
.wkpick span{font-size:11px;color:var(--muted)}
.wkpick a.past{opacity:.7}
.wkpick a.today span{color:var(--apple);font-weight:700}
.wkpick a[aria-current="page"]{background:var(--navy);border-color:var(--navy);color:#fff;opacity:1}
.wkpick a[aria-current="page"] span{color:#cfd7df}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:13px;padding:4px;margin-top:16px}
.seg button{flex:1;border:0;background:transparent;font-weight:700;font-size:14px;color:var(--muted);padding:9px 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sb{font-family:var(--mono);font-size:11px;background:var(--apple);color:#fff;border-radius:99px;padding:1px 6px}

/* Plan */
.tonight{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px}
.tonight .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.tchip{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:13px;font-weight:700;padding:5px 10px 5px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.tchip svg{width:16px;height:16px;color:var(--apple)}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:14px}
details.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
details.blk summary{list-style:none;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
details.blk summary::-webkit-details-marker{display:none}
.bt{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bn{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;line-height:1.1}
.bn small{display:block;font-family:var(--body);text-transform:none;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .15s}
details[open] > summary .chev{transform:rotate(180deg)}
details.blk.now{border-color:var(--now);box-shadow:0 0 0 2px var(--now)}
.nowtag{display:inline-block;background:var(--now);color:#14202e;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.bb{padding:0 14px 14px 78px;min-width:0}
.bb p{margin:0 0 6px} .bb ul{margin:4px 0 0;padding-left:18px} .bb li{margin:3px 0}
@media (max-width:520px){.bb{padding-left:14px}}
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:10px}
.st{border-radius:12px;padding:12px}
.st.p{background:var(--apple-soft)} .st.h{background:var(--sky-soft)} .st.d{background:var(--turf-soft)}
.st h4{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.st.p h4{color:var(--apple)} .st.h h4{color:var(--sky)} .st.d h4{color:var(--turf)}
.st strong{display:block;margin:2px 0}
.st .who{font-size:12px;color:var(--muted)}
.st ul{font-size:14px}
.rot{border-collapse:collapse;width:100%;min-width:300px;font-size:13px;margin-top:8px}
.rot th,.rot td{border-bottom:1px solid var(--line);padding:6px;text-align:left;white-space:nowrap}
.rot th{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.p{background:var(--apple-soft);color:var(--apple)} .tag.h{background:var(--sky-soft);color:var(--sky)} .tag.d{background:var(--turf-soft);color:var(--turf)}
.flex{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.grp{border-radius:12px;padding:10px 12px;background:var(--bg)}
.grp h3{margin:0 0 4px;font-family:var(--display);font-size:18px;text-transform:uppercase}
.grp ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:14px}
.grp li.me{background:var(--now);color:#14202e;border-radius:6px;padding:0 5px;font-weight:700}
.grp .path{font-size:12px;color:var(--muted);margin-top:6px}
.ptag{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--apple);margin-left:2px}

/* Check-in */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-height:52px}
.chip .no{font-family:var(--display);font-weight:800;font-size:20px;width:30px;text-align:center;color:var(--muted)}
.chip .nm{font-weight:600;font-size:14px;line-height:1.2;min-width:0}
.chip .nm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip[aria-pressed="true"] .no{color:#ff4d63}
.chip[aria-pressed="true"] .nm small{color:#cfd7df}
.mode{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sky-soft);color:var(--sky)}
.count{font-family:var(--mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* Measure */
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px}
.mhead select{font-weight:700}
.acts{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:0 0 auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:86px;padding:10px 4px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;line-height:1.15;text-align:center}
.act svg{width:26px;height:26px;color:var(--apple)}
.act .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:500}
.act .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--apple)}
.act[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.act[aria-pressed="true"] svg{color:#ff4d63} .act[aria-pressed="true"] .cnt{color:#cfd7df}
.tool-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tool-h h2{font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;margin:0}
.who-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.kids{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.kid{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:96px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left;line-height:1.2}
.kid b{font-size:14px} .kid small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.kid.has small{color:var(--turf);font-weight:700}
.kid.sel{border-color:var(--apple);box-shadow:inset 0 0 0 1.5px var(--apple)}
.kid.out{opacity:.4;border-style:dashed}
.kid.live{border-color:var(--turf)}
.kid.done{background:var(--turf-soft);border-color:var(--turf)}
.kid.done small{color:var(--turf);font-weight:700}
.kid.pr{background:var(--gold);border-color:var(--gold);color:#1d1500} .kid.pr small{color:#1d1500}
.clock{font-family:var(--display);font-size:clamp(68px,22vw,104px);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1;margin-top:14px}
.clock-sub{text-align:center;font-size:14px;color:var(--muted);margin-top:4px}
.go{display:block;margin:14px auto 0;width:min(100%,340px);height:92px;border-radius:999px;border:0;background:var(--turf);color:#fff;font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:.08em;box-shadow:0 8px 20px rgba(22,128,79,.3)}
.go.stop{background:var(--apple);box-shadow:0 8px 20px rgba(210,31,60,.3)}
.go.end{background:var(--navy);font-size:24px;letter-spacing:.03em;height:72px;box-shadow:none}
.go:disabled{opacity:.4}
@media (prefers-reduced-motion:no-preference){.go:active,.pp:active,.key:active,.kid:active,.chip:active{transform:scale(.97)}}
.result{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--chip);margin-top:16px}
.result .rv{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.result .rt{flex:1;min-width:0;font-size:14px;line-height:1.3} .result .rt b{display:block}
.result.pr{background:var(--gold);color:#1d1500}
.result.base{background:var(--sky-soft)}
.typeit{display:block;margin:12px auto 0}
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.lrow:last-child{border-bottom:0}
.lrow .v{font-family:var(--mono);font-weight:700;font-size:15px;min-width:64px;text-align:right}
.lrow .v.none{color:var(--muted);font-weight:500}
.lrow .bst{font-size:11px;color:var(--muted);text-align:right}
.lrow .plus{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700}
@media (max-width:420px){.lrow .bst{display:none}}
.hist summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);margin-top:16px}
.hist ul{list-style:none;margin:8px 0 0;padding:0}
.hist li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li span{flex:1} .hist .x{border:0;background:var(--chip);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
/* Bullpen tool */
.pen-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px}
.mini-seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.mini-seg button{border:0;background:transparent;font-weight:700;color:var(--muted);padding:7px 14px;border-radius:8px}
.mini-seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sbd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.sbx{background:var(--bg);border-radius:12px;padding:8px 10px}
.sbx b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sbx span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sbx.good b{color:var(--turf)} .sbx.warn b{color:var(--clay)} .sbx.bad b{color:var(--apple)}
@media (max-width:480px){.sbd{grid-template-columns:repeat(2,1fr)}}
.pitchpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pp{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;border-radius:14px;border:0;padding:12px;min-height:68px}
.pp.k{background:var(--turf);color:#fff} .pp.b{background:var(--apple);color:#fff}
.pp.f,.pp.ip{background:var(--sky-soft);color:var(--sky);font-size:20px}
.pp.nb{background:var(--bg);border:1.5px solid var(--line);font-size:18px;grid-column:span 2}
.trail{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;min-height:22px}
.trail span{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--bg)}
.trail .s{color:var(--turf)} .trail .bl{color:var(--apple)} .trail .sep{background:transparent;color:var(--muted)}
.capwarn{margin-top:10px;font-weight:700;color:#fff;background:var(--apple);border-radius:10px;padding:8px 12px;font-size:14px}
.saved{font-size:12px;color:var(--muted);font-weight:600}

/* Number pad sheet */
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,13,20,.5)}
#sheet[hidden]{display:none}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25)}

const ERR={pin:"Code rejected. Sign in again.",coach_only:"Only coaches can change that.",exists:"Already saved. A coach can change it.",bad_sheet:"That save didn't have a home in the sheet."};
let queue=[]; try{queue=JSON.parse(LS.get("ma_q")||"[]")}catch(e){}
let sending=0,flushTimer=null;
const saveQ=()=>LS.set("ma_q",JSON.stringify(queue));
function shape(j){const d=j.data||j;return {role:j.role||"coach",roster:d.roster||[],attendance:d.attendance||[],bullpens:d.bullpens||[],tests:d.tests||[],attempts:d.attempts||[],notes:d.notes||[]}}
function setD(x){D=x;aggCache=null;queue.forEach(applyLocal);try{LS.set("ma_D",JSON.stringify(x))}catch(e){}}
function applyLocal(op){
  if(!D)return; const k=keyName(op.sheet); D[k]=D[k]||[];
  const row=D[k].find(r=>op.keys.every(x=>String(r[x])===String(op.rec[x])));
  if(row)Object.keys(op.rec).forEach(f=>{const v=op.rec[f];if(op.mode==="overwrite"||(v!==""&&v!=null))row[f]=v});
  else D[k].push({...op.rec});
  aggCache=null;
}
function save(sheet,keys,rec,mode,dedupe){
  const op={sheet,keys,rec,mode:mode||"merge"};
  if(dedupe)for(let i=queue.length-1;i>=sending;i--){const q=queue[i];if(q.sheet===sheet&&keys.every(x=>String(q.rec[x])===String(rec[x]))){queue[i]=op;applyLocal(op);saveQ();schedule(1200);updateSync();return}}
  queue.push(op);applyLocal(op);saveQ();schedule(dedupe?1200:300);updateSync();
}
function schedule(ms){clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms==null?300:ms)}
async function post(body){const r=await fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,pin})});return r.json()}
async function flush(){
  if(sending||!queue.length||!URL_||!pin)return;
  const ops=queue.slice(0,30); sending=ops.length; updateSync();
  let j;
  try{j=await post({action:"batch",ops});offline=false}
  catch(e){sending=0;offline=true;updateSync();schedule(8000);return}
  if(j.ok){queue.splice(0,ops.length);sending=0;saveQ();setD(shape(j));lastSync=new Date()}
  else if(j.error==="pin"){sending=0;signOut("That code stopped working. Sign in again.");return}
  else{
    for(let i=0;i<ops.length;i++){const op=ops[i];let k;try{k=await post({action:"save",...op})}catch(e){offline=true;break}
      queue.shift();saveQ();if(k.ok){setD(shape(k));lastSync=new Date()}else toast(ERR[k.error]||"The sheet refused one save.")}
  }
  sending=0;updateSync();safeRender();if(queue.length)schedule(offline?8000:100);
}

function measureWeek(){if(mt.wid)return WEEKS.find(w=>w.id===mt.wid);const t=todayStr();return WEEKS.find(w=>w.date===t)||[...WEEKS].reverse().find(w=>w.date<t)||WEEKS[0]}

function toolHead(key,extra){const m=MET[key];return `<div class="tool-h"><h2>${m?m.name:"Bullpen"}</h2>${extra||""}</div>${m?`<p class="hint">${m.how}</p>`:""}`}
function valTag(key,v){return v==null?"–":MET[key].show(v)}
function historyHTML(key,w){
  const rs=attemptsFor(key,w.id).slice().reverse(),R=roster();if(!rs.length)return "";

function nextUp(key,w,kids,after){
  const pending=kids.filter(p=>weekBest(p.n,key,w.id)==null),pool=pending.length?pending:kids;if(!pool.length)return null;
  const i=after==null?-1:kids.findIndex(p=>p.n===after);
  return (pool.find(p=>kids.indexOf(p)>i)||pool[0]).n;
}
function logAttempt(key,n,v){

  save("Attempts",["ID"],{ID:id,Week:w.id,Date:w.date,Number:n,Metric:key,Value:v},"merge");
  mine.add(id);LS.set("ma_mine",JSON.stringify([...mine].slice(-300)));
  const pr=prev!=null&&better(v,prev,m.dir);buzz(pr?[30,40,30]:25);if(pr)confetti();
  return {id,n,v,key,prev,pr,first:prev==null};
}

function openPad(key,n){pad={key,n,val:"",msg:""};renderPad()}
function renderPad(){

function padKey(k){if(!pad)return;const m=MET[pad.key];let v=pad.val;
  if(k==="⌫")v=v.slice(0,-1);else if(k==="."){if(m.dec&&!v.includes("."))v=(v||"0")+"."}else if(v.replace(".","").length<5)v=(v==="0"?"":v)+k;

function padSave(){
  if(!pad||!pad.val)return;const m=MET[pad.key],v=Number(pad.val);
  if(isNaN(v)||v<m.min||v>m.max){pad.msg=`That doesn't look right. Expect ${m.min}–${m.max} ${m.unit}.`;renderPad();return}
  const r=logAttempt(pad.key,pad.n,v),p=roster().find(x=>x.n===pad.n),w=measureWeek();
  const others=whoList(w).filter(x=>x.n!==pad.n),pend=others.filter(x=>weekBest(x.n,pad.key,w.id)==null);

  const key=pad.key;pad=null;$("#sheet").hidden=true;render();
  if(pend.length)openPad(key,nextUp(key,w,others,null)),pad.msg=msg,renderPad();else toast(msg+(others.length?" · everyone's in":""));

/* Bullpen charter: every pitch saves itself */
function penKey(wid,n){return "ma_pen3_"+wid+"_"+n}
function penSess(wid,n){try{const s=JSON.parse(LS.get(penKey(wid,n))||"null");if(s&&s.id)return s}catch(e){}return {id:uid(),log:[],cue:""}}
function setPenSess(wid,n,s){LS.set(penKey(wid,n),JSON.stringify(s))}
function batters(log){const b=[];log.forEach((p,i)=>{if(i===0||p.nb)b.push([]);b[b.length-1].push(p)});return b}
function penStats(log){
  const bs=batters(log),pitches=log.length,strikes=log.filter(p=>p.r==="S").length;
  const fps=bs.filter(b=>b[0].r==="S").length,ahead=bs.filter(b=>{const f=b.slice(0,3),k=f.filter(p=>p.r==="S").length;return k>=Math.min(2,f.length)}).length;
  const ch=log.filter(p=>p.t==="CH"),cur=bs.length?bs[bs.length-1]:[];
  return {pitches,strikes,batters:bs.length,fps,ahead,ch:ch.length,chS:ch.filter(p=>p.r==="S").length,balls:cur.filter(p=>p.r==="B").length,ks:Math.min(2,cur.filter(p=>p.r==="S").length),ended:!!(log.length&&log[log.length-1].end)};
}
function countStrikes(log){let k=0;for(let i=log.length-1;i>=0;i--){k+=log[i].r==="S"?1:0;if(i===0||log[i].nb)break}return k}
function penTool(w){
  const kids=whoList(w),order=[...kids.filter(p=>p.p),...kids.filter(p=>!p.p)];
  if(!order.some(p=>String(p.n)===pen.who))pen.who=String((order[0]||{}).n??"");
  if(!order.length)return toolHead("pen")+`<p class="empty">No players yet.</p>`;
  const n=Number(pen.who),s=penSess(w.id,n),log=s.log,S=penStats(log);
  const sp=pct(S.strikes,S.pitches),fp=pct(S.fps,S.batters),ap=pct(S.ahead,S.batters);
  const trail=batters(log).map((b,i)=>(i?'<span class="sep">|</span>':"")+b.map(p=>`<span class="${p.r==="S"?"s":"bl"}">${p.f?"F":p.r==="S"?"K":"B"}${p.t==="CH"?"c":""}</span>`).join("")).join("");
  const savingNow=queue.some(q=>q.sheet==="Bullpens"&&String(q.rec.ID)===s.id),capHit=w.capN&&S.pitches>=w.capN;
  return toolHead("pen",`<span class="saved">${log.length?(savingNow?"Saving…":"Saved ✓"):(w.capN?"Cap "+w.capN+" pitches":"Flat ground week")}</span>`)+`
   <p class="hint">A teammate charts on a coach's phone. Tap every pitch and it saves as you go. Walks, strikeouts and balls in play start the next batter on their own.</p>
   <div class="who-t">Pitcher</div>
   <div class="kids">${order.map(p=>{const ps=pens(w.id).find(r=>r.Number===p.n);return `<button class="kid ${String(p.n)===pen.who?"sel":""} ${ps?"has":""}" data-pitcher="${p.n}"><b>${esc(shortName(p))}${p.p?'<span class="ptag">P</span>':""}</b><small>${ps?ps.Pitches+" p · "+ps["Strike %"]+"%":"–"}</small></button>`}).join("")}</div>
   <div class="pen-top"><span class="mono" style="font-weight:700">${S.ended?`Batter ${S.batters+1} · 0-0`:`Batter ${Math.max(1,S.batters)} · ${S.balls}-${S.ks}`}</span>
    <div class="mini-seg" role="group" aria-label="Pitch type"><button data-ptype="FB" aria-pressed="${pen.type==="FB"}">FB</button><button data-ptype="CH" aria-pressed="${pen.type==="CH"}">CH</button></div></div>
   <div class="sbd">
    <div class="sbx ${grade(sp,60,50)}"><b>${sp==null?"–":sp+"%"}</b><span>Strikes ${S.strikes}/${S.pitches}</span></div>
    <div class="sbx ${grade(fp,60,50)}"><b>${fp==null?"–":fp+"%"}</b><span>1st-pitch K</span></div>

    return `<a class="tile ${t?"":"open"} ${isMe?"mine":""}" href="#board-${k}"><span class="tl-n">${b.name}</span><span class="tl-w">${t?esc(shortName(t.p)):"Up for grabs"}</span><span class="tl-v">${t?b.fmt(t.v):"—"}</span></a>`}).join("")}</div>`).join("");
  const earned=[];R.forEach(p=>BADGES.forEach(b=>{if(b.test(p))earned.push({p,b})}));
  out+=`<section class="card" style="margin-top:22px"><div class="ch"><h2>Badge wall</h2><span class="count">${earned.length} earned</span></div>${BADGES.map(b=>{const who=earned.filter(x=>x.b===b);return `<div class="bw-row"><div><b>${b.name}</b><small>${b.how}</small></div><div class="bw-who">${who.length?who.map(x=>`<a href="#player-${x.p.n}" class="${String(x.p.n)===me?"me":""}">${esc(shortName(x.p))}</a>`).join(""):'<span class="hint">Nobody yet</span>'}</div></div>`}).join("")}</section>`;
  return head+out;
}

/* ================= Events ================= */
document.addEventListener("submit",e=>{if(e.target.id==="pinform"){e.preventDefault();const v=$("#pin").value.trim();if(!v)return;pin=v;pinErr="";LS.set("ma_pin",v);load()}});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.blk;if(k)openBlk[k]=e.target.open},true);
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="mwk"){mt.wid=t.value;st.last=null;t.blur();render();return}
  if(t.id==="pickme"&&t.value){me=t.value;LS.set("ma_me",me);t.blur();render();toast("Got it. You're highlighted everywhere.");return}
  if(t.dataset.pd&&route.sub==="player"){pdraft[route.n]=pdraft[route.n]||{};pdraft[route.n][t.dataset.pd]=t.value;return}
  if(t.id==="pencue"){const w=measureWeek(),n=Number(pen.who),s=penSess(w.id,n);s.cue=t.value;if(s.log.length)penPersist(w,n,s);else setPenSess(w.id,n,s);return}
});
document.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el)return;const d=el.dataset,w=measureWeek();
  if(d.seg){const[g,k]=d.seg.split(":");if(g==="p")pseg=k;render();return}
  if(el.id==="signout"){signOut("");return}
  if(el.id==="isme"){me=d.num;LS.set("ma_me",me);render();toast("Saved on this phone");return}
  if(el.id==="notme"){me="";LS.del("ma_me");render();return}
  if(d.att){const wk=WEEKS.find(x=>x.id===route.wid),n=Number(d.att),on=el.getAttribute("aria-pressed")!=="true";save("Attendance",["Week","Number"],{Week:wk.id,Date:wk.date,Number:n,Present:on},"overwrite");buzz(15);render();return}
  if(d.ptog){const n=Number(d.ptog),on=el.getAttribute("aria-pressed")!=="true";save("Roster",["Number"],{Number:n,Pitcher:on},"overwrite");render();return}
  if(el.id==="psave"){const n=Number(d.num),g=id=>($("#"+id)||{}).value||"",cur=roster().find(p=>p.n===n)||{};
    const rec={Number:n,Primary:g("ed-pos1"),Secondary:g("ed-pos2"),Bats:g("ed-bats"),Throws:g("ed-throws")};rec.Pitcher=rec.Primary==="P"||rec.Secondary==="P"||(cur.p&&cur.pos1!=="P"&&cur.pos2!=="P");
    save("Roster",["Number"],rec,"overwrite");delete pdraft[n];toast("Saved");render();return}
  if(d.act){if(st.running||gt.running){toast("Finish the timer first");return}mt.act=d.act;history.replaceState(null,"","#measure-"+d.act);st.last=null;render();return}
  if(el.id==="mall"){mt.all=!mt.all;render();return}
  if(d.void){save("Attempts",["ID"],{ID:d.void,Void:true},"merge");if(st.last&&st.last.id===d.void)st.last=null;Object.keys(gt.done).forEach(k=>{if(gt.done[k].id===d.void)delete gt.done[k]});toast("Removed");render();return}
  if(d.runner){if(st.running)return;st.who=Number(d.runner);st.last=null;render();return}
  if(el.id==="tgo"){
    if(!st.running){st.running=true;st.t0=performance.now();stayAwake();buzz(15);render()}
    else{const v=+((performance.now()-st.t0)/1000).toFixed(2);st.running=false;const m=MET[mt.act];
      if(v<m.min){toast("Too quick to be real. Tap Start and go again.");render();return}
      st.last=logAttempt(mt.act,st.who,v);st.who=nextUp(mt.act,w,whoList(w),st.who);render()}
    return}
  if(d.padfor!==undefined){if(d.padfor===""){toast("Pick a runner first");return}openPad(mt.act,Number(d.padfor));return}
  if(d.pad){openPad(mt.act,Number(d.pad));return}
  if(el.id==="gstart"){gt.running=true;gt.ended=false;gt.t0=performance.now();gt.done={};stayAwake();buzz(30);render();return}
  if(el.id==="gend"){const v=Math.round((performance.now()-gt.t0)/1000);whoList(w).filter(p=>!gt.out.has(p.n)&&!gt.done[p.n]).forEach(p=>{const r=logAttempt("plank",p.n,v);gt.done[p.n]={v,id:r.id,pr:r.pr}});gt.running=false;gt.ended=true;gt.elapsed=v;render();return}
  if(el.id==="greset"){gt={running:false,t0:0,ended:false,elapsed:0,out:gt.out,done:{},wid:w.id};render();return}
  if(d.plank){const n=Number(d.plank);
    if(gt.running){if(gt.done[n]){save("Attempts",["ID"],{ID:gt.done[n].id,Void:true},"merge");delete gt.done[n];toast("Undone. He's back on the clock.")}
      else if(!gt.out.has(n)){const v=Math.round((performance.now()-gt.t0)/1000);if(v<MET.plank.min){toast("Too soon. Wait for him to drop.");return}const r=logAttempt("plank",n,v);gt.done[n]={v,id:r.id,pr:r.pr};
        if(!whoList(w).some(p=>!gt.out.has(p.n)&&!gt.done[p.n])){gt.running=false;gt.ended=true;gt.elapsed=v}}}
    else if(!gt.ended){gt.out.has(n)?gt.out.delete(n):gt.out.add(n)}
    render();return}
  if(d.pitcher){pen.who=d.pitcher;render();return}
  if(d.ptype){pen.type=d.ptype;render();return}
  if(d.pitch){const n=Number(pen.who),s=penSess(w.id,n),log=s.log,k=d.pitch,last=log[log.length-1];
    if(k==="NB"){if(last&&!last.end)last.end="m"}
    else{const before=last&&!last.end?countStrikes(log):0,p={r:k==="B"?"B":"S",t:pen.type};if(last&&last.end)p.nb=true;if(k==="F")p.f=1;log.push(p);
      const balls=penStats(log).balls;if(k==="IP"||(k==="S"&&before>=2)||(k==="B"&&balls>=4))p.end="a"}
    buzz(12);penPersist(w,n,s);render();return}
  if(el.id==="penundo"){const n=Number(pen.who),s=penSess(w.id,n),last=s.log[s.log.length-1];if(last&&last.end==="m")delete last.end;else s.log.pop();penPersist(w,n,s);render();return}
  if(d.k){padKey(d.k);return}
  if(el.id==="padsave"){padSave();return}
  if(el.id==="padx"){pad=null;renderPad();return}
});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet"){pad=null;renderPad()}});
document.addEventListener("keydown",e=>{
  if(pad){if(/^[0-9]$/.test(e.key))padKey(e.key);else if(e.key===".")padKey(".");else if(e.key==="Backspace")padKey("⌫");else if(e.key==="Enter")padSave();else if(e.key==="Escape"){pad=null;renderPad()}else return;e.preventDefault();return}
  if(e.key===" "&&route.page==="measure"&&!busy()&&$("#tgo")){e.preventDefault();$("#tgo").click()}
});
let nTimer=null;
document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("notes-")){const wid=e.target.id.slice(6),v=e.target.value,s=$("#nsave");if(s)s.textContent="Typing…";clearTimeout(nTimer);nTimer=setTimeout(()=>{const wk=WEEKS.find(x=>x.id===wid);save("Notes",["Week"],{Week:wid,Date:wk.date,Notes:v},"overwrite",true);const s=$("#nsave");if(s)s.textContent="Saved"},1200)}});

/* ================= Boot ================= */
window.addEventListener("hashchange",go);
window.addEventListener("online",()=>{offline=false;schedule(0);load(true)});
go();load();if(queue.length)schedule(500);
setInterval(()=>{if(document.visibilityState==="visible"&&!st.running&&!gt.running)load(true)},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){load(true);if(queue.length)schedule(0)}});
</script>
</body>
</html>
